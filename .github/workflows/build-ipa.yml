name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LocalMusic/**'
      - 'LocalMusicTests/**'
      - 'LocalMusic.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show installed Xcode
        run: xcodebuild -version

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator found")
          ')"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build for iOS Simulator
        run: >-
          xcodebuild -project LocalMusic.xcodeproj -scheme LocalMusic
          -sdk iphonesimulator -configuration Debug -derivedDataPath simulator-build
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Inspect built simulator name and icons
        run: |
          python3 - <<'PY'
          import plistlib
          with open("simulator-build/Build/Products/Debug-iphonesimulator/LocalMusic.app/Info.plist", "rb") as file:
              info = plistlib.load(file)
          for key in ("CFBundleName", "CFBundleDisplayName", "CFBundleIcons", "CFBundleIcons~ipad"):
              print(key, "=", info.get(key))
          assert info["CFBundleName"] == "Audyn", info
          assert info["CFBundleDisplayName"] == "Audyn", info
          PY

      - name: Run unit tests
        run: >-
          xcodebuild -project LocalMusic.xcodeproj -scheme LocalMusic
          -sdk iphonesimulator -configuration Debug -derivedDataPath simulator-build
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test

      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get --path TestResults.xcresult --format json | python3 -c '
          import json, sys
          result = json.load(sys.stdin)
          for issue in result.get("issues", {}).get("testFailureSummaries", {}).get("_values", []):
              test = issue.get("testCaseName", {}).get("_value", "Test")
              message = issue.get("message", {}).get("_value", "Unknown failure")
              location = issue.get("documentLocationInCreatingWorkspace", {}).get("url", {}).get("_value", "")
              print(f"{test}: {message}\n{location}")
          '
          fi

      - name: Build unsigned device app
        run: >-
          xcodebuild -project LocalMusic.xcodeproj -scheme LocalMusic
          -sdk iphoneos -configuration Release -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/LocalMusic.app ipa/Payload/
          ditto -c -k --sequesterRsrc --keepParent ipa/Payload Audyn-unsigned.ipa

      - name: Verify packaged name, app icon, background audio and version
        run: |
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile("Audyn-unsigned.ipa") as ipa:
              info = plistlib.loads(ipa.read("Payload/LocalMusic.app/Info.plist"))
              files = ipa.namelist()
          modes = info.get("UIBackgroundModes")
          assert isinstance(modes, list) and "audio" in modes, f"Missing background audio: {modes!r}"
          assert info["CFBundleShortVersionString"] == "0.2.0", info
          assert info["CFBundleVersion"] == "3", info
          assert info["CFBundleDisplayName"] == "Audyn", info
          assert info["CFBundleName"] == "Audyn", info
          assert info["CFBundleIdentifier"] == "com.localmusic.app", info
          for key in ("CFBundleIcons", "CFBundleIcons~ipad"):
              primary = info[key]["CFBundlePrimaryIcon"]
              assert primary["CFBundleIconName"] == "AppIcon", primary
              icons = primary.get("CFBundleIconFiles", [])
              assert icons, primary
              for icon in icons:
                  assert any(name.startswith("Payload/LocalMusic.app/" + icon) and name.endswith(".png") for name in files), icon
          assert "Payload/LocalMusic.app/Assets.car" in files, "Missing compiled asset catalog"
          print("Verified IPA: Audyn 0.2.0 (3), iPhone/iPad app icons, UIBackgroundModes =", modes)
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Audyn-unsigned-ipa
          path: Audyn-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
